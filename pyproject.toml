[project]
name = "plate"
version = "0.1.0"
description = "Text a photo of your food, get your macros and what's left for the day."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
plate = "plate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
